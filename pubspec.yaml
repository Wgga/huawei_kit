name: huawei_kit
description: Huawei Account Kit authentication for Flutter on HarmonyOS.
version: 1.0.1
homepage: https://github.com/Wgga/huawei_kit
repository: https://github.com/Wgga/huawei_kit.git
issue_tracker: https://github.com/Wgga/huawei_kit/issues

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ohos:
        pluginClass: HuaweiKitPlugin
